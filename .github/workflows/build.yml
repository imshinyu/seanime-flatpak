name: Build, Release and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Import GPG key and configure agent for headless signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg

          # The freedesktop CI image ships no pinentry program, so gpg-agent
          # cannot prompt for a passphrase. Allow the passphrase to be cached.
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          gpgconf --kill gpg-agent || true
          gpg-connect-agent reloadagent /bye

          # If the signing key is passphrase-protected, cache the passphrase in
          # the agent so flatpak-builder can sign without pinentry.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            PRESET="$(command -v gpg-preset-passphrase || find /usr/lib* /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -1)"
            gpg --with-keygrip --list-secret-keys --with-colons \
              | awk -F: '/^grp/{print $10}' \
              | while read -r keygrip; do
                  printf '%s' "$GPG_PASSPHRASE" | "$PRESET" --preset "$keygrip"
                done
          fi

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Seanime.flatpak
          manifest-path: io.github.seanime.Seanime.yml
          cache-key: flatpak-builder-${{ github.sha }}
          build-dir: builddir
          repo-dir: repo
          gpg-sign: ${{ secrets.GPG_KEY_ID }}

      - name: Sign repo and create .flatpakrepo
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail

          # Sign the exported ref and the repository summary
          flatpak build-sign --gpg-sign="$GPG_KEY_ID" repo io.github.seanime.Seanime
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --generate-static-deltas --prune repo/

          # Base64-encode the public key so clients can verify the repo
          GPG_KEY_BASE64="$(gpg --export "$GPG_KEY_ID" | base64 --wrap=0)"
          
          
          # Generate .flatpakrepo file
          cat > repo/seanime.flatpakrepo << EOF
          [Flatpak Repo]
          Title=Seanime Flatpak Repo
          Url=https://imshinyu.github.io/seanime-flatpak
          Homepage=https://github.com/imshinyu/seanime-flatpak
          Comment=Unofficial Seanime Flatpak builds
          Description=Flatpak repository for Seanime - self-hosted anime and manga media server
          Icon=https://raw.githubusercontent.com/imshinyu/seanime-flatpak/main/icon.png
          GPGKey=${GPG_KEY_BASE64}
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o 'seanime-denshi-[0-9.]*_Linux' io.github.seanime.Seanime.yml | head -1 | sed 's/seanime-denshi-//;s/_Linux//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Seanime v${{ steps.version.outputs.version }}
          body: |
            Flatpak build of Seanime v${{ steps.version.outputs.version }}.
            
            **Install from repo:**
            ```bash
            flatpak remote-add --if-not-exists seanime https://imshinyu.github.io/seanime-flatpak/seanime.flatpakrepo
            flatpak install seanime io.github.seanime.Seanime
            ```
            
            **Or install the .flatpak bundle:**
            ```bash
            flatpak install Seanime.flatpak
            ```
          files: Seanime.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
