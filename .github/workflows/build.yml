name: Build and Release Flatpak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-freedesktop-24.08-v2
          restore-keys: flatpak-sdk-freedesktop-

      - name: Install Flatpak SDK (only if cache miss)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Get version for release tag
        id: version
        run: |
          VERSION=$(grep -oP '(?<=seanime-denshi-)[0-9.]+(?=_Linux)' io.github.seanime.Seanime.yml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('io.github.seanime.Seanime.yml') }}
          restore-keys: flatpak-builder-

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo builddir io.github.seanime.Seanime.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo Seanime.flatpak io.github.seanime.Seanime

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Seanime v${{ steps.version.outputs.version }}
          body: Flatpak build of Seanime v${{ steps.version.outputs.version }}. Download the `.flatpak` file below and install with `flatpak install Seanime.flatpak`
          files: Seanime.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}
